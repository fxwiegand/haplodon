[package]
name = "haplodon"
version = "0.17.0"
description = "Uncertainty aware haplotype based genomic variant effect prediction"
license = "MIT"
authors = ["Felix Wiegand <felix.wiegand@tu-dortmund.de>", "Johannes Köster <johannes.koester@tu-dortmund.de>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap_derive = "4.5.3"
rust-htslib = "0.49.0"
bio = "2.3.0"
anyhow = "1.0.102"
varlociraptor = "8.9.3"
petgraph = { version = "0.8.3", features = ["serde-1"]}
itertools = "0.15.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
json5 = "1.3.1"
duckdb = { version = "1.10503.1", features = ["bundled"]}
csv = "1.4.0"
log = "0.4.31"
rayon = "1.12.0"
env_logger = "0.11.6"
genebears = "0.2.2"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "fat"
